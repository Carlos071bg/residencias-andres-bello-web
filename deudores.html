<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Panel de Administrador - Deudores</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --mint: #14b899;
      --navy: #123450;
      --light: #f8fafc;
      --danger: #ef4444;
      --danger-light: #fee2e2;
    }
    * { box-sizing: border-box; }
    body { margin: 0; padding: 20px; font-family: 'Inter', sans-serif; background: #e2e8f0; color: var(--navy); }
    .container { max-width: 800px; margin: 0 auto; background: white; padding: 30px; border-radius: 15px; box-shadow: 0 10px 25px rgba(0,0,0,0.05); }
    h1 { margin-top: 0; font-size: 1.8rem; border-bottom: 2px solid #e2e8f0; padding-bottom: 15px; display: flex; align-items: center; gap: 10px; }
    .btn-refresh { background: var(--mint); color: white; border: none; padding: 8px 15px; border-radius: 8px; cursor: pointer; font-weight: 600; font-size: 0.9rem; margin-left: auto; }
    .btn-refresh:hover { background: #087965; }
    
    .loading { text-align: center; padding: 40px; color: #64748b; font-style: italic; }
    .error { background: var(--danger-light); color: var(--danger); padding: 15px; border-radius: 8px; text-align: center; font-weight: 600; display: none; }
    
    table { width: 100%; border-collapse: collapse; margin-top: 20px; }
    th, td { padding: 15px; text-align: left; border-bottom: 1px solid #e2e8f0; }
    th { background: var(--light); font-weight: 600; color: #64748b; text-transform: uppercase; font-size: 0.85rem; letter-spacing: 0.5px; }
    tr:last-child td { border-bottom: none; }
    .badge { background: var(--danger-light); color: var(--danger); padding: 4px 8px; border-radius: 12px; font-size: 0.8rem; font-weight: 700; }
    .amount { font-family: monospace; font-size: 1.1rem; font-weight: 600; }
    
    .summary-cards { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 20px; margin-top: 30px; }
    .card { background: var(--light); padding: 20px; border-radius: 10px; text-align: center; border: 1px solid #e2e8f0; }
    .card h3 { margin: 0 0 10px; font-size: 0.9rem; color: #64748b; text-transform: uppercase; }
    .card .val { font-size: 1.8rem; font-weight: 700; color: var(--navy); margin: 0; }
    .card .val.red { color: var(--danger); }
    
    @media (max-width: 600px) {
      .summary-cards { grid-template-columns: 1fr; }
      th, td { padding: 10px 5px; font-size: 0.9rem; }
    }
  </style>
</head>
<body>

  <div class="container">
    <h1>
      📊 Reporte de Deudores 
      <button class="btn-refresh" onclick="cargarDeudas()">Actualizar Datos</button>
    </h1>
    
    <div id="error-msg" class="error"></div>
    <div id="loading" class="loading">Cargando datos desde la base de datos...</div>
    
    <div id="content" style="display: none;">
      <div class="summary-cards">
        <div class="card">
          <h3>Apartamentos con deuda</h3>
          <p class="val" id="total-aptos">0</p>
        </div>
        <div class="card">
          <h3>Deuda Total (USD)</h3>
          <p class="val red" id="total-usd">$0.00</p>
        </div>
        <div class="card">
          <h3>Deuda Total (Bs)</h3>
          <p class="val red" id="total-bs">Bs 0.00</p>
        </div>
      </div>

      <table id="tabla-deudas">
        <thead>
          <tr>
            <th>Apto</th>
            <th>Meses Adeudados</th>
            <th>Deuda ($)</th>
            <th>Deuda (Bs)</th>
          </tr>
        </thead>
        <tbody>
          <!-- Llenado por JS -->
        </tbody>
      </table>
    </div>
  </div>

  <script>
    var ENDPOINT = "https://script.google.com/macros/s/AKfycbyM3Z3dYBaQcaKEdn588WaTM7wKp_8zE9KHqNciKmfNoqFx76-9TtV8EjHvx8OyVtrG9w/exec";
    
    function cargarDeudas() {
      document.getElementById("content").style.display = "none";
      document.getElementById("error-msg").style.display = "none";
      document.getElementById("loading").style.display = "block";
      
      fetch(ENDPOINT + "?action=deudores&t=" + Date.now())
        .then(function(r) { return r.json(); })
        .then(function(data) {
          document.getElementById("loading").style.display = "none";
          
          if (data.error) {
            document.getElementById("error-msg").textContent = data.error;
            document.getElementById("error-msg").style.display = "block";
            return;
          }
          
          document.getElementById("content").style.display = "block";
          
          var tbody = document.querySelector("#tabla-deudas tbody");
          tbody.innerHTML = "";
          
          var sumaUsd = 0;
          var sumaBs = 0;
          var countAptos = 0;
          
          if (data.deudas && data.deudas.length > 0) {
            data.deudas.forEach(function(d) {
              // Filtrar el apartamento 11 por seguridad visual
              if (String(d.apto) === "11") return;
              
              countAptos++;
              sumaUsd += Number(d.usd) || 0;
              sumaBs += Number(d.bs) || 0;
              
              var tr = document.createElement("tr");
              tr.innerHTML = "<td><strong>" + d.apto + "</strong></td>" +
                             "<td><span class='badge'>" + d.meses + "</span></td>" +
                             "<td class='amount'>$" + (Number(d.usd) || 0).toFixed(2) + "</td>" +
                             "<td class='amount'>Bs " + (Number(d.bs) || 0).toFixed(2) + "</td>";
              tbody.appendChild(tr);
            });
          }
          
          if (countAptos === 0) {
            tbody.innerHTML = "<tr><td colspan='4' style='text-align:center; padding:30px; color:#10b981; font-weight:bold;'>¡Excelente! No hay apartamentos con deudas reportadas.</td></tr>";
          }
          
          document.getElementById("total-aptos").textContent = countAptos;
          document.getElementById("total-usd").textContent = "$" + sumaUsd.toFixed(2);
          document.getElementById("total-bs").textContent = "Bs " + sumaBs.toFixed(2);
        })
        .catch(function(e) {
          document.getElementById("loading").style.display = "none";
          document.getElementById("error-msg").textContent = "Error de conexión al cargar la deuda.";
          document.getElementById("error-msg").style.display = "block";
        });
    }

    // Cargar al inicio
    document.addEventListener("DOMContentLoaded", cargarDeudas);
  </script>
</body>
</html>
