<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Verificar Pago | Residencias Andrés Bello</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;900&display=swap" rel="stylesheet">
  <style>
    :root { --mint: #14b899; --mint-dark: #087965; --navy: #123450; --light: #f5f7f5; }
    body { margin: 0; font-family: 'Inter', sans-serif; background: var(--light); color: var(--navy); min-height: 100vh; display: flex; align-items: center; justify-content: center; }
    .card { background: white; padding: 50px 40px; border-radius: 24px; box-shadow: 0 20px 50px rgba(0,0,0,0.08); max-width: 440px; width: 90%; text-align: center; }
    .logo { display: inline-flex; align-items: center; justify-content: center; width: 60px; height: 60px; background: var(--mint); color: white; font-weight: 900; font-size: 1.4rem; border-radius: 16px; margin-bottom: 20px; letter-spacing: -1px; }
    h1 { font-size: 1.6rem; margin: 0 0 8px; letter-spacing: -0.5px; }
    .subtitle { color: #64748b; font-size: 0.95rem; margin: 0 0 30px; line-height: 1.5; }
    label { display: block; text-align: left; font-weight: 600; font-size: 0.9rem; margin-bottom: 6px; color: var(--navy); }
    select { width: 100%; padding: 14px 16px; border: 2px solid #e2e8f0; border-radius: 12px; font-size: 1rem; font-family: 'Inter', sans-serif; color: var(--navy); background: white; margin-bottom: 20px; appearance: none; cursor: pointer; transition: border-color 0.2s; }
    select:focus { outline: none; border-color: var(--mint); }
    .btn { display: block; width: 100%; padding: 16px; background: var(--mint); color: white; border: none; border-radius: 12px; font-size: 1.1rem; font-weight: 700; font-family: 'Inter', sans-serif; cursor: pointer; transition: all 0.3s; box-shadow: 0 8px 20px rgba(20,184,153,0.3); }
    .btn:hover { background: var(--mint-dark); transform: translateY(-2px); box-shadow: 0 12px 28px rgba(20,184,153,0.4); }
    .btn:disabled { background: #94a3b8; cursor: not-allowed; transform: none; box-shadow: none; }
    .result { margin-top: 20px; padding: 16px; border-radius: 12px; font-size: 0.95rem; line-height: 1.5; display: none; }
    .result.error { display: block; background: #fef2f2; border: 1px solid #fecaca; color: #dc2626; }
    .result.success { display: block; background: #f0fdf4; border: 1px solid #bbf7d0; color: #16a34a; }
    .result.loading { display: block; background: #f8fafc; border: 1px solid #e2e8f0; color: #64748b; }
    .back-link { display: inline-block; margin-top: 20px; color: #64748b; font-size: 0.85rem; text-decoration: none; }
    .back-link:hover { color: var(--mint-dark); }
    @keyframes spin { to { transform: rotate(360deg); } }
    .spinner { display: inline-block; width: 18px; height: 18px; border: 3px solid #e2e8f0; border-top-color: var(--mint); border-radius: 50%; animation: spin 0.6s linear infinite; vertical-align: middle; margin-right: 8px; }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo">RA</div>
    <h1>Reportar Pago</h1>
    <p class="subtitle">Selecciona tu apartamento y el mes que deseas pagar para verificar que no exista un registro previo.</p>
    
    <label for="apto">Apartamento</label>
    <select id="apto">
      <option value="">Selecciona tu apartamento</option>
    </select>
    
    <label for="mes">Mes a pagar</label>
    <select id="mes">
      <option value="">Selecciona el mes</option>
      <option value="enero">Enero 2026</option>
      <option value="febrero">Febrero 2026</option>
      <option value="marzo">Marzo 2026</option>
      <option value="abril">Abril 2026</option>
      <option value="mayo">Mayo 2026</option>
      <option value="junio">Junio 2026</option>
      <option value="julio">Julio 2026</option>
      <option value="agosto">Agosto 2026</option>
      <option value="septiembre">Septiembre 2026</option>
      <option value="octubre">Octubre 2026</option>
      <option value="noviembre">Noviembre 2026</option>
      <option value="diciembre">Diciembre 2026</option>
    </select>
    
    <button class="btn" id="verificar-btn" onclick="verificar()">Verificar y continuar</button>
    
    <div class="result" id="resultado"></div>
    
    <a href="dashboard.html" class="back-link">&larr; Volver al panel</a>
  </div>

  <script>
    var ENDPOINT = "https://script.google.com/macros/s/AKfycbyM3Z3dYBaQcaKEdn588WaTM7wKp_8zE9KHqNciKmfNoqFx76-9TtV8EjHvx8OyVtrG9w/exec";
    var FORM_URL = "https://docs.google.com/forms/d/e/1FAIpQLSe9DGuaUtaWF4WO4DJ9DgAh0t8BMmfnsXHeLed1Wag_UKDj8g/viewform?usp=header";

    // Generar opciones de apartamentos (1-25)
    var selectApto = document.getElementById("apto");
    for (var i = 1; i <= 25; i++) {
      var opt = document.createElement("option");
      opt.value = i;
      opt.textContent = "Apartamento " + i;
      selectApto.appendChild(opt);
    }

    function verificar() {
      var apto = document.getElementById("apto").value;
      var mes = document.getElementById("mes").value;
      var resultado = document.getElementById("resultado");
      var btn = document.getElementById("verificar-btn");

      if (!apto || !mes) {
        resultado.className = "result error";
        resultado.textContent = "Por favor selecciona tu apartamento y el mes.";
        return;
      }

      btn.disabled = true;
      resultado.className = "result loading";
      resultado.innerHTML = '<span class="spinner"></span> Verificando...';

      fetch(ENDPOINT + "?action=verificar&apto=" + apto + "&mes=" + mes + "&t=" + Date.now())
        .then(function(r) { return r.json(); })
        .then(function(data) {
          if (data.duplicado) {
            resultado.className = "result error";
            resultado.textContent = "El apartamento " + apto + " ya tiene un pago registrado para " + mes + ". Si crees que es un error, contacta a la administracion.";
          } else {
            resultado.className = "result success";
            resultado.textContent = "Todo en orden. Redirigiendo al formulario de pago...";
            setTimeout(function() {
              window.location.href = FORM_URL;
            }, 1500);
          }
          btn.disabled = false;
        })
        .catch(function() {
          resultado.className = "result error";
          resultado.textContent = "Error de conexion. Intenta de nuevo.";
          btn.disabled = false;
        });
    }
  </script>
</body>
</html>
